<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../css/style.css">


</head>


<body>


    <!-- ========================================
         MAIN SPLASH SCREEN
    ========================================= -->

    <section class="splash">


        <!-- --------------------
             WAVES
        --------------------- -->

        <canvas class="wave-background" aria-hidden="true"></canvas>



        <!-- --------------------
             NAVIGATION
        --------------------- -->

        <nav>

            <a href="index.html">Home</a>

            <a href="./pages/projects.html">Projects</a>

            <a href="./pages/members.html">Members</a>

            <a href="./pages/meetings.html">Meetings</a>

        </nav>

        <div class="hero-copy">
            <h1 class="hero-title" aria-label="The Singularity is Coming.">
                <span class="title-guide" aria-hidden="true">The Singularity is Coming.</span>
                <span class="typed-text" aria-hidden="true"></span>
            </h1>
            <p class="hero-subtitle" aria-label="Tuesdays 6:30-7:30 Anne Belk 311">
                <span class="title-guide" aria-hidden="true">Tuesdays 6:30-7:30 Anne Belk 311</span>
                <span class="typed-text" aria-hidden="true"></span>
            </p>
        </div>

    </section>

    <script src="./scripts/waves.js" defer></script>
    <script>
        const headline = "The Singularity is Coming.";
        const subtitle = "Tuesdays 6:30-7:30 Anne Belk 311";
        const headlineText = document.querySelector(".hero-title .typed-text");
        const subtitleText = document.querySelector(".hero-subtitle .typed-text");

        function typeLine(element, words, onComplete) {
            let characterIndex = 0;
            element.classList.add("is-typing");
            const typing = setInterval(() => {
                element.textContent += words[characterIndex++];
                if (characterIndex === words.length) {
                    clearInterval(typing);
                    if (onComplete) onComplete();
                }
            }, 95);
        }

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            headlineText.textContent = headline;
            subtitleText.textContent = subtitle;
        } else {
            setTimeout(() => {
                typeLine(headlineText, headline, () => {
                    setTimeout(() => {
                        headlineText.classList.remove("is-typing");
                        typeLine(subtitleText, subtitle);
                    }, 700);
                });
            }, 400);
        }
    </script>
</body>
</html>
